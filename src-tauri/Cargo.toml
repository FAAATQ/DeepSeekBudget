[package]
name = "deepseek-budget"
description = "See the price. Know when to wait. A menu bar indicator for DeepSeek's peak/off-peak API pricing."
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is the feature that makes this a menu bar app at all.
# `image-png` is required for `Image::from_bytes` to decode the bundled PNGs.
# `macos-private-api` is only for the popover's transparency and rounded corners; it is a
# documented App Store blocker, which is irrelevant for a tray utility that ships unsigned.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }

deepseekbudget-schedule = { path = "../crates/schedule" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native window material. On macOS 26+ this is real Liquid Glass (NSGlassEffectView); it
# degrades to NSVisualEffectView vibrancy on older macOS, and to acrylic/mica on Windows.
# Its objc2 requirements are already satisfied by the versions tauri pulls in (objc2 0.6.4,
# objc2-app-kit 0.3.2), so this adds no duplicate dependency — only the crate's own few KB.
window-vibrancy = "0.8"

# Reads the system UI language. Zero dependencies on native targets — on macOS it calls
# CFLocaleCopyPreferredLanguages directly.
sys-locale = "0.3"

# The login item: a value under HKCU\...\CurrentVersion\Run on Windows, a LaunchAgent plist under
# ~/Library/LaunchAgents on macOS.
#
# `winreg` is Windows-only because it `compile_error!`s anywhere else, and it adds nothing to the
# lock file — `winreg 0.55` is already there via `embed-resource`, which `tauri-build` pulls in.
# The macOS half needs no dependency at all: `std::fs` plus the home directory Tauri's path
# resolver already knows. Neither is an HTTP client or a TLS stack, so hard constraint 5 (the
# Rust tree stays network-free) is untouched.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Two AppKit calls `window-vibrancy` does not make for us: clipping the window's content to the
# card's rounded corner (see `popover::clip_to_card_radius`). Its glass view is given a corner
# radius but nothing in the chain ever sets `masksToBounds`, so the window's rectangular edge
# keeps being drawn outside the corner. Same version Tauri already pulls in (0.6.4), so this adds
# no crate to the lock file — only a direct edge to one that is already there.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
